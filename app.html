<!DOCTYPE html>
<html lang="en-AU" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/consent.js"></script>
    <title>Vector Circle Packer — Free circle packing SVG generator</title>
    <meta name="description" content="Fill any image with tightly packed circles and download clean SVG. Control zones by brightness or colour, set circle sizes, choose per-zone colours. Free, browser-based, no signup.">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Carl Manson">
    <meta property="og:title" content="Vector Circle Packer — Free circle packing SVG generator">
    <meta property="og:description" content="Image in, circles out. Zone-based circle packing with clean SVG output. Free, no signup, runs in your browser.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="d-flex flex-column">

<canvas id="hiddenCanvas" style="display:none;"></canvas>

<!-- Top nav -->
<header id="appNav" class="border-bottom flex-shrink-0">
    <div class="d-flex align-items-center gap-2 px-3 py-2">
        <button class="d-md-none btn btn-sm border-0 text-body p-1 me-1" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar">
            <i class="bi bi-list fs-5"></i>
        </button>
        <a href="index.html" class="text-decoration-none text-reset">
            <span class="fw-bold" style="font-size:0.95rem;">
                <i class="bi bi-circle-fill me-2" style="color:var(--cp-accent);font-size:0.7rem;vertical-align:middle;"></i>Vector Circle Packer
            </span>
        </a>
    </div>
</header>

<!-- App body (sidebar + preview) -->
<div id="appBody" class="d-flex flex-grow-1 overflow-hidden">

<!-- Sidebar -->
<div id="sidebar" class="offcanvas-md offcanvas-start bg-body border-end"
     style="--bs-offcanvas-width:320px;" tabindex="-1" aria-labelledby="sidebarLabel">

    <div class="offcanvas-header d-md-none border-bottom py-2">
        <h6 class="offcanvas-title mb-0" id="sidebarLabel">Vector Circle Packer</h6>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"></button>
    </div>

    <div class="offcanvas-body">

        <!-- Step navigation -->
        <div class="step-nav">
            <button class="step-btn active" data-step="0"><span class="step-num">1</span>Image</button>
            <button class="step-btn"        data-step="1"><span class="step-num">2</span>Mode</button>
            <button class="step-btn"        data-step="2"><span class="step-num">3</span>Zones</button>
            <button class="step-btn"        data-step="3"><span class="step-num">4</span>Circles</button>
        </div>

        <!-- Panel 1: Image & Adjustments -->
        <div class="step-panel" id="panel0">
            <div class="mb-3">
                <label class="section-label">Image</label>
                <input type="file" id="imageUpload" class="form-control form-control-sm" accept="image/png,image/jpeg">
            </div>
            <div>
                <div class="section-label d-flex align-items-center justify-content-between">
                    <span>Adjustments</span>
                    <button type="button" id="resetAdjustmentsBtn" class="btn btn-link btn-sm p-0 text-muted" title="Reset adjustments">Reset</button>
                </div>
                <div class="compact-row">
                    <label>Brightness</label>
                    <input type="range" id="brightness" class="form-range" min="-100" max="100" value="0">
                    <span class="val" id="brightnessVal">0</span>
                </div>
                <div class="compact-row">
                    <label>Contrast</label>
                    <input type="range" id="contrast" class="form-range" min="-100" max="100" value="0">
                    <span class="val" id="contrastVal">0</span>
                </div>
                <div class="compact-row">
                    <label>Gamma</label>
                    <input type="range" id="gamma" class="form-range" min="0.1" max="3.0" step="0.05" value="1.0">
                    <span class="val" id="gammaVal">1.00</span>
                </div>
                <div class="compact-row">
                    <label>Blur</label>
                    <input type="range" id="blur" class="form-range" min="0" max="20" step="0.5" value="0">
                    <span class="val" id="blurVal">0</span>
                </div>
            </div>
        </div>

        <!-- Panel 2: Mode & Zones setup -->
        <div class="step-panel d-none" id="panel1">
            <div class="mb-3">
                <div class="section-label">Zone Mode</div>
                <div class="btn-group w-100" id="modeToggle" role="group">
                    <button type="button" class="btn btn-sm btn-primary" id="modeBrightness">Brightness</button>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="modeHue">Hue</button>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2">
                <span class="section-label mb-0">Number of zones</span>
                <input type="number" id="numZones" class="form-control form-control-sm" style="width:70px;" value="1" min="1" max="8">
            </div>
            <div id="hueResetNote" class="alert alert-warning small py-2 px-2 mb-3 d-none">
                Changing the zone count resets hue angles to an even distribution. Any custom angles set in step 3 will be lost.
            </div>
            <div id="thresholdSection" class="mb-3">
                <label class="section-label">Threshold <span class="float-end fw-normal" id="thresholdVal">128</span></label>
                <input type="range" id="threshold" class="form-range" min="0" max="255" value="128">
                <div class="text-muted small mt-1">Pixels above this luminance are excluded (background).</div>
            </div>
            <div id="neutralZoneToggles" class="d-none">
                <div class="section-label">Neutral zones</div>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="checkbox" id="blackZoneToggle">
                    <label class="form-check-label small" for="blackZoneToggle">Black zone (low luminance)</label>
                </div>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="checkbox" id="whiteZoneToggle">
                    <label class="form-check-label small" for="whiteZoneToggle">White zone (high luminance)</label>
                </div>
            </div>
        </div>

        <!-- Panel 3: Zone Config -->
        <div class="step-panel d-none" id="panel2">
            <!-- Brightness: zone summary strips -->
            <div id="panel2Brightness">
                <div id="zoneSummaryContainer"></div>
            </div>
            <!-- Hue: colour wheel + neutral zones -->
            <div id="panel2Hue" class="d-none">
                <div id="hueWheelContainer"></div>
                <div id="blackZoneContainer"></div>
                <div id="whiteZoneContainer"></div>
            </div>
            <div id="bgZoneSection" class="mt-3">
                <div class="form-check mb-1">
                    <input class="form-check-input" type="checkbox" id="bgZoneEnabled">
                    <label class="form-check-label small" for="bgZoneEnabled">Background zone (above threshold)</label>
                </div>
            </div>
        </div>

        <!-- Panel 4: Circle Config -->
        <div class="step-panel d-none" id="panel3">
            <div class="accordion accordion-flush border rounded" id="zonesAccordion"></div>
        </div>

        <!-- Step footer -->
        <div class="step-footer">
            <button id="resetBtn" class="btn btn-outline-secondary btn-sm" title="Reset All Settings"><i class="bi bi-arrow-counterclockwise"></i></button>
            <button id="prevBtn" class="btn btn-outline-secondary btn-sm" disabled>← Back</button>
            <span id="stepLabel" class="text-muted small mx-auto">Step 1 of 4</span>
            <button id="nextBtn" class="btn btn-primary btn-sm">Next →</button>
            <!-- Mobile only: Generate/Download visible in sidebar on step 4 -->
            <button id="generateBtnMobile" class="btn btn-primary btn-sm d-md-none" style="display:none">Generate</button>
            <button id="downloadBtnMobile" class="btn btn-success btn-sm d-md-none" style="display:none" disabled>↓ SVG</button>
        </div>

    </div><!-- /offcanvas-body -->
</div><!-- /sidebar -->

<!-- Preview -->
<div id="preview">
    <div id="previewContent">
        <canvas id="previewCanvas"></canvas>
        <svg id="outputSvg" xmlns="http://www.w3.org/2000/svg" style="display:none;"></svg>
    </div>
    <img id="sourceThumb" class="d-none" alt="Source reference" draggable="false"
         style="position:absolute; top:1rem; left:1rem; width:160px; height:auto; max-height:40vh; object-fit:contain; border-radius:.375rem; border:1px solid var(--bs-border-color); box-shadow:0 .5rem 1rem rgba(0,0,0,.15); background:var(--bs-body-bg); cursor:grab; user-select:none; z-index:10;">
    <div id="previewFooter" class="d-none p-3 bg-body border-top w-100">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <p id="status" class="text-muted small mb-0" style="min-height:1.2em;"></p>
                </div>
                <div class="col-auto">
                    <div class="d-flex gap-2">
                        <button id="generateBtn" class="btn btn-primary">Generate Circles</button>
                        <button id="downloadBtn" class="btn btn-success" disabled>Download SVG</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div><!-- /#preview -->

</div><!-- /#appBody -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="main.js"></script>
</body>
</html>
