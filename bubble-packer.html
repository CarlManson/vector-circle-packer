<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Packer</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#0f0f1a; }
#toolbar {
  position:fixed; inset:0 0 auto 0; z-index:10; height:44px;
  display:flex; align-items:center; gap:8px; padding:0 12px;
  background:rgba(15,15,26,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,0.07);
  font-family:system-ui,-apple-system,sans-serif;
}
#hint { flex:1; font-size:0.75rem; color:rgba(255,255,255,0.35); }
.btn {
  font-size:0.75rem; padding:5px 13px; border-radius:5px;
  border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.07);
  color:rgba(255,255,255,0.7); cursor:pointer; white-space:nowrap;
}
.btn:hover, .btn:active { background:rgba(255,255,255,0.16); }
#artboard {
  position:fixed; top:44px; left:0;
  touch-action:none; cursor:crosshair;
  user-select:none; -webkit-user-select:none;
}
</style>
</head>
<body>
<div id="toolbar">
  <span id="hint">Hold to grow · Tap to split</span>
  <button class="btn" id="clearBtn">Clear</button>
  <button class="btn" id="exportBtn">Export SVG</button>
</div>
<svg id="artboard"></svg>
<script>
'use strict';

const PALETTE = [
  '#FF6B6B','#4ECDC4','#FFD93D','#A78BFA','#6BCB77',
  '#4D96FF','#FF9F1C','#F72585','#00B4D8','#B5E48C',
  '#C77DFF','#FF8C69','#06D6A0','#EF476F','#118AB2'
];
const GROW_SPEED  = 80;
const MAX_RADIUS  = 320;
const MIN_SAVE_R  = 5;
const MIN_SPLIT_R = 8;
const TAP_MS      = 280;
const WALL_COLOR  = 'rgba(255,255,255,0.7)';
const WALL_W      = 1.5;
const BG          = '#0f0f1a';
const BOND_DEPTH  = 0.28; // overlap as fraction of smaller radius

const svg = document.getElementById('artboard');
let W = 0, H = 0;
let bubbles    = [];
let growing    = null;
let pendingTap = null;
let nextId     = 0;
let colorIdx   = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight - 44;
  svg.setAttribute('width',   W);
  svg.setAttribute('height',  H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  render();
}
window.addEventListener('resize', resize);
resize();

// ── Geometry ─────────────────────────────────────────────
const dist  = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const fmt   = v => v.toFixed(1);
const nextColor = () => PALETTE[colorIdx++ % PALETTE.length];

function bondDist(r1, r2) {
  return r1 + r2 - BOND_DEPTH * Math.min(r1, r2);
}

function snapToBond(mover, fixed) {
  const dT = bondDist(mover.r, fixed.r);
  const dx = mover.x - fixed.x, dy = mover.y - fixed.y;
  const d  = Math.hypot(dx, dy);
  if (d < 0.01) { mover.x = fixed.x + dT; return; }
  mover.x = fixed.x + (dx / d) * dT;
  mover.y = fixed.y + (dy / d) * dT;
}

// Chord endpoints where two overlapping circles intersect
function chordPoints(b1, b2) {
  const dx = b2.x - b1.x, dy = b2.y - b1.y;
  const d  = Math.hypot(dx, dy);
  if (d === 0 || d >= b1.r + b2.r || d <= Math.abs(b1.r - b2.r)) return null;
  const a  = (b1.r*b1.r - b2.r*b2.r + d*d) / (2*d);
  const h  = Math.sqrt(Math.max(0, b1.r*b1.r - a*a));
  const mx = b1.x + a*dx/d, my = b1.y + a*dy/d;
  const px = -dy/d, py = dx/d;
  return [
    { x: mx + h*px, y: my + h*py },
    { x: mx - h*px, y: my - h*py }
  ];
}

// Build an SVG path for a bubble clipped at all its bond chords.
// Each bonded bubble masks the arc that overlaps it; the chord becomes a straight edge.
function bubblePath(b, all) {
  // Gather all chord-intersection points on b's circumference
  const pts = [];
  for (const bid of b.bonds) {
    const o = all.find(x => x.id === bid);
    if (!o) continue;
    const cp = chordPoints(b, o);
    if (!cp) continue;
    pts.push({ angle: Math.atan2(cp[0].y - b.y, cp[0].x - b.x), x: cp[0].x, y: cp[0].y });
    pts.push({ angle: Math.atan2(cp[1].y - b.y, cp[1].x - b.x), x: cp[1].x, y: cp[1].y });
  }

  if (!pts.length) {
    // Full circle — two semicircle arcs (SVG can't do a single-arc full circle)
    const rx = fmt(b.x + b.r), lx = fmt(b.x - b.r), cy = fmt(b.y), r = fmt(b.r);
    return `M ${rx} ${cy} A ${r} ${r} 0 1 1 ${lx} ${cy} A ${r} ${r} 0 1 1 ${rx} ${cy}`;
  }

  pts.sort((a, b) => a.angle - b.angle);
  const n = pts.length;

  // Is the arc from pts[i] to pts[(i+1)%n] (clockwise, sweep=1) visible?
  // Visible = mid-arc point is NOT inside any bonded bubble.
  function isVis(i) {
    const a1 = pts[i].angle;
    let   a2 = pts[(i + 1) % n].angle;
    if (a2 <= a1) a2 += 2 * Math.PI;
    const ma = (a1 + a2) / 2;
    const mx = b.x + b.r * Math.cos(ma);
    const my = b.y + b.r * Math.sin(ma);
    return ![...b.bonds].some(bid => {
      const o = all.find(x => x.id === bid);
      return o && Math.hypot(mx - o.x, my - o.y) < o.r;
    });
  }

  // Find first visible arc as starting point
  let si = -1;
  for (let i = 0; i < n; i++) { if (isVis(i)) { si = i; break; } }
  if (si < 0) return ''; // entirely occluded

  const d = [`M ${fmt(pts[si].x)} ${fmt(pts[si].y)}`];
  let i = si;

  do {
    if (isVis(i)) {
      const ni = (i + 1) % n;
      const a1 = pts[i].angle;
      let   a2 = pts[ni].angle;
      if (a2 <= a1) a2 += 2 * Math.PI;
      const la = (a2 - a1) > Math.PI ? 1 : 0;
      d.push(`A ${fmt(b.r)} ${fmt(b.r)} 0 ${la} 1 ${fmt(pts[ni].x)} ${fmt(pts[ni].y)}`);
      i = ni;
    } else {
      // Skip over hidden arcs with a straight chord line
      let ni = (i + 1) % n, guard = 0;
      while (!isVis(ni) && ni !== si && guard++ < n) ni = (ni + 1) % n;
      d.push(`L ${fmt(pts[ni].x)} ${fmt(pts[ni].y)}`);
      i = ni;
    }
  } while (i !== si);

  d.push('Z');
  return d.join(' ');
}

function hitBubble(x, y) {
  for (let i = bubbles.length - 1; i >= 0; i--)
    if (dist({ x, y }, bubbles[i]) <= bubbles[i].r) return bubbles[i];
  return null;
}

// ── Render ────────────────────────────────────────────────
function render() {
  const gBubble = growing
    ? { id: -1, x: growing.x, y: growing.y, r: growing.r, color: growing.color, bonds: growing.bonds }
    : null;
  const all = gBubble ? [...bubbles, gBubble] : [...bubbles];

  const seen = new Set();
  const wallPairs = [];
  for (const b of all) {
    for (const bid of b.bonds) {
      const lo = Math.min(b.id, bid), hi = Math.max(b.id, bid);
      const key = `${lo}|${hi}`;
      if (seen.has(key)) continue;
      seen.add(key);
      const other = all.find(x => x.id === bid);
      if (other) wallPairs.push([b, other]);
    }
  }

  const out = [`<rect width="${W}" height="${H}" fill="${BG}"/>`];

  for (const b of all) {
    const fill   = `fill="${b.color}" fill-opacity="0.45"`;
    const stroke = `stroke="${b.color}" stroke-width="1.5" stroke-opacity="0.85"`;
    if (b.bonds.size > 0) {
      const dp = bubblePath(b, all);
      if (dp) out.push(`<path d="${dp}" ${fill} ${stroke} stroke-linejoin="round"/>`);
    } else {
      out.push(`<circle cx="${fmt(b.x)}" cy="${fmt(b.y)}" r="${fmt(b.r)}" ${fill} ${stroke}/>`);
    }
  }

  for (const [b1, b2] of wallPairs) {
    const cp = chordPoints(b1, b2);
    if (!cp) continue;
    out.push(`<line x1="${fmt(cp[0].x)}" y1="${fmt(cp[0].y)}" x2="${fmt(cp[1].x)}" y2="${fmt(cp[1].y)}" stroke="${WALL_COLOR}" stroke-width="${WALL_W}" stroke-linecap="round"/>`);
  }

  svg.innerHTML = out.join('');
}

// ── Physics propagation ───────────────────────────────────
// After any structural change, relax all bond-distance constraints
// symmetrically so the displacement ripples through the cluster.
function propagate() {
  for (let iter = 0; iter < 80; iter++) {
    let maxErr = 0;
    for (const b of bubbles) {
      for (const bid of b.bonds) {
        if (bid <= b.id) continue;
        const o = bubbles.find(x => x.id === bid);
        if (!o) continue;
        const dx = o.x - b.x, dy = o.y - b.y;
        const d  = Math.hypot(dx, dy);
        if (d < 0.01) continue;
        const dT  = bondDist(b.r, o.r);
        const err = d - dT;
        if (Math.abs(err) < 0.3) continue;
        const factor = err * 0.5 / d;
        b.x += dx * factor; b.y += dy * factor;
        o.x -= dx * factor; o.y -= dy * factor;
        maxErr = Math.max(maxErr, Math.abs(err));
      }
    }
    if (maxErr < 0.3) break;
  }
}

// ── Grow ──────────────────────────────────────────────────
function startGrowing(x, y) {
  if (growing) stopGrowing(false);
  growing = { x, y, r: 2, color: nextColor(), bonds: new Set(), startTs: null, rafId: null };
  growing.rafId = requestAnimationFrame(growFrame);
}

function growFrame(ts) {
  if (!growing.startTs) growing.startTs = ts;
  growing.r = Math.min(MAX_RADIUS, 2 + GROW_SPEED * (ts - growing.startTs) / 1000);

  for (const b of bubbles) {
    if (!growing.bonds.has(b.id) && dist(growing, b) < growing.r + b.r) {
      growing.bonds.add(b.id);
      snapToBond(growing, b);
    }
  }

  render();
  growing.rafId = requestAnimationFrame(growFrame);
}

function stopGrowing(save) {
  if (!growing) return;
  cancelAnimationFrame(growing.rafId);
  if (save && growing.r >= MIN_SAVE_R) {
    const nb = {
      id: nextId++, x: growing.x, y: growing.y,
      r: growing.r, color: growing.color, bonds: new Set(growing.bonds)
    };
    bubbles.push(nb);
    for (const bid of nb.bonds) {
      const o = bubbles.find(x => x.id === bid);
      if (o) o.bonds.add(nb.id);
    }
    propagate();
  }
  growing = null;
  render();
}

// ── Split ─────────────────────────────────────────────────
function splitBubble(id) {
  const idx = bubbles.findIndex(b => b.id === id);
  if (idx === -1) return;
  const orig = bubbles[idx];
  if (orig.r < MIN_SPLIT_R) return;

  const newR   = orig.r / Math.SQRT2;
  // Place children at the correct bond overlap from each other immediately
  const offset = bondDist(newR, newR) / 2;
  const angle  = Math.random() * Math.PI * 2;

  const b1 = { id: nextId++, x: orig.x + offset * Math.cos(angle), y: orig.y + offset * Math.sin(angle), r: newR, color: nextColor(), bonds: new Set() };
  const b2 = { id: nextId++, x: orig.x - offset * Math.cos(angle), y: orig.y - offset * Math.sin(angle), r: newR, color: nextColor(), bonds: new Set() };
  b1.bonds.add(b2.id);
  b2.bonds.add(b1.id);

  for (const bid of orig.bonds) {
    const other = bubbles.find(x => x.id === bid);
    if (!other) continue;
    other.bonds.delete(id);
    const near = dist(b1, other) <= dist(b2, other) ? b1 : b2;
    near.bonds.add(other.id);
    other.bonds.add(near.id);
  }

  bubbles.splice(idx, 1, b1, b2);
  propagate();
  render();
}

// ── Export ────────────────────────────────────────────────
function exportSVG() {
  const raw   = svg.outerHTML;
  const fixed = raw.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
  const out   = `<?xml version="1.0" encoding="UTF-8"?>\n${fixed}`;
  const blob  = new Blob([out], { type: 'image/svg+xml' });
  const url   = URL.createObjectURL(blob);
  const a     = Object.assign(document.createElement('a'), { href: url, download: 'bubbles.svg' });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ── Pointer events ────────────────────────────────────────
function svgPoint(e) {
  const r = svg.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

svg.addEventListener('pointerdown', e => {
  e.preventDefault();
  svg.setPointerCapture(e.pointerId);
  const { x, y } = svgPoint(e);
  const hit = hitBubble(x, y);
  if (hit) { pendingTap = { id: hit.id, t: Date.now() }; }
  else      { startGrowing(x, y); }
});

svg.addEventListener('pointerup', e => {
  e.preventDefault();
  if (pendingTap) {
    if (Date.now() - pendingTap.t < TAP_MS) splitBubble(pendingTap.id);
    pendingTap = null;
  }
  stopGrowing(true);
});

svg.addEventListener('pointercancel', () => {
  pendingTap = null;
  stopGrowing(false);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  bubbles = []; colorIdx = 0;
  if (growing) stopGrowing(false);
  render();
});
document.getElementById('exportBtn').addEventListener('click', exportSVG);
</script>
</body>
</html>
